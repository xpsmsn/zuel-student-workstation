[package]
name = "zuel-student-workstation"
version = "2.1.0"
description = "中南大学生工作台 —— 本地运行、数据不外传的辅导员工作台"
authors = ["吴章凡 <wuzhangfan110@163.com>"]
edition = "2021"

[lib]
# `_lib` 后缀是必须的：让 lib 名与 bin 名不冲突（Windows 上的已知问题）。
name = "zuel_student_workstation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：v1.8 最小化到系统托盘、后台常驻
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# 开机启动（跨平台；Windows 写「启动」目录、macOS 写 LaunchAgent，均不需要管理员权限）
tauri-plugin-autostart = "2"
# 单实例：已经在跑的时候再双击一次，只把原来的窗口叫回来，不开第二个（v1.9.1）
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 体积优化：单文件 exe 尽量小
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
